id: P0-SCENARIO-01
title: Inspect deterministic anonymized fixture scenarios
status: verified
source_requirements:
  - Phase 0 P0.5 Scenario and fixture factory
  - All user-facing dates use Asia/Karachi while storage uses UTC
roles:
  - owner
input_sources:
  - fixture_catalog_v1
authority:
  observe:
    - owner
  change: []
  external_action: none
api_contracts:
  - GET /v1/scenarios/{scenario_id}
visible_outcomes:
  - deterministic Scenario Lab route
  - explicit fixture and anonymization labels
  - UTC storage time paired with Asia/Karachi display time
  - counts for all twelve required fixture families
  - locked consequential actions
required_states:
  - valid
  - stale
  - duplicate
  - contradictory
  - denied
  - degraded
  - timeout
  - recovery
forbidden_outcomes:
  - real customer, employee, provider, or financial data
  - source-accounting write
  - external provider action
  - cloud-model inference
  - fixture data presented as production data
proof_scenarios:
  - every scenario returns the same deterministic clock and anonymized fixture catalog
  - UTC storage and Asia/Karachi display represent the same instant
  - unknown scenarios fail closed
  - every scenario is visible at three desktop viewports without browser errors or overflow
rollback: Remove the Scenario Lab route and scenario API while retaining P0-SHELL-01.
