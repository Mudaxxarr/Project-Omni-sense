name: Phase 0 CI parity

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase0-parity:
    name: Windows deterministic parity
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 resolved 2026-08-02

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 resolved 2026-08-02
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12.13"
          enable-cache: true

      - name: Install locked dependencies
        shell: powershell
        run: |
          corepack.cmd pnpm install --frozen-lockfile
          uv sync --locked

      - name: Install Chromium
        shell: powershell
        run: corepack.cmd pnpm --filter "@omniscience/desktop" exec playwright install chromium

      - name: Ensure native PostgreSQL 16
        shell: powershell
        run: |
          $pgReady = "C:\Program Files\PostgreSQL\16\bin\pg_isready.exe"
          if (-not (Test-Path -LiteralPath $pgReady)) {
            choco.exe install postgresql16 --version=16.14.0 --yes --no-progress --params "'/Password:omniscience-ci-local-only'"
          }
          $pgServer = "C:\Program Files\PostgreSQL\16\bin\postgres.exe"
          if (-not (Test-Path -LiteralPath $pgServer)) {
            throw "PostgreSQL 16 server binary is missing."
          }
          $postgresVersion = (& $pgServer --version | Out-String).Trim()
          if ($postgresVersion -ne "postgres (PostgreSQL) 16.14") {
            throw "PostgreSQL server must be exactly 16.14; found $postgresVersion."
          }
          $pgService = Get-Service -Name "postgresql*16*" -ErrorAction Stop |
            Select-Object -First 1
          if ($pgService.Status -ne "Running") {
            Start-Service -Name $pgService.Name
          }
          & $pgReady -h 127.0.0.1 -p 5432 -t 5
          if ($LASTEXITCODE -ne 0) {
            throw "PostgreSQL 16 did not become ready."
          }

      - name: Run repository-owned CI parity
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\ci.ps1

      - name: Upload deterministic verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: phase0-ci-verification-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            output/ci-verification
